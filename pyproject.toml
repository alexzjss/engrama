[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engrama"
version = "0.20.0"
requires-python = ">=3.13"
dependencies = ["pygame-ce", "numpy", "psutil"]

[project.scripts]
engrama = "engrama.app.host:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "ruff"]
build = ["pyinstaller"]

[tool.setuptools.packages.find]
include = ["engrama*"]

[tool.setuptools.package-data]
engrama = ["recipes/*.toml", "app/i18n/*.json", "app/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: long-running acceptance tests (in the default and CI runs; skip with -m \"not slow\" for a quick loop)",
    "perf: asserts measured wall time, CPU or FPS against a budget (noisy on loaded runners; CI runs them apart)",
]

[tool.ruff]
target-version = "py313"
line-length = 130
extend-exclude = ["spike", "art-review", ".pytest_tmp"]

[tool.ruff.lint]
select = ["F", "E9", "B006", "B008", "B904"]
