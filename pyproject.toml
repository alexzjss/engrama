[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engrama"
version = "0.3.0"
requires-python = ">=3.13"
dependencies = ["pygame-ce", "numpy", "psutil"]

[project.scripts]
engrama = "engrama.app.host:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["engrama*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: long-running acceptance tests (included in the default run)"]
