[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engrama"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pygame-ce", "numpy", "psutil"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["engrama*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
